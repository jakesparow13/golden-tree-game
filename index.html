<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🌳 الشجرة الذهبية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#d4af37;
    --gold-bright:#ffd700;
    --emerald:#3ddc97;
    --bg:#0a0a0a;
    --card-bg:#141414;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);
    font-family:'Cairo',Tahoma,sans-serif;
    color:#f2f2f2;
    min-height:100vh;
    padding-bottom:30px;
  }
  h1,h2,.brand{font-family:'Amiri',serif;}

  /* ===== Top bar ===== */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    background:linear-gradient(180deg,rgba(212,175,55,0.12),transparent);
    border-bottom:1px solid rgba(212,175,55,0.25);
  }
  .brand{
    font-size:20px;
    font-weight:700;
    color:var(--gold-bright);
  }
  .balance-pill{
    display:flex;
    align-items:center;
    gap:6px;
    background:linear-gradient(145deg,#1c1c1c,#0d0d0d);
    border:1.5px solid var(--gold);
    border-radius:30px;
    padding:6px 16px;
    font-weight:700;
    color:var(--gold-bright);
    font-size:15px;
  }
  .user-line{
    text-align:center;
    font-size:13px;
    color:var(--emerald);
    padding:6px 0 14px;
  }

  /* ===== Lobby grid ===== */
  #lobbyView{display:block;}
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    padding:0 16px;
  }
  .game-card{
    position:relative;
    background:var(--card-bg);
    border-radius:16px;
    overflow:hidden;
    border:2px solid var(--gold);
    box-shadow:0 0 0 1px rgba(61,220,151,0.25) inset, 0 6px 16px rgba(0,0,0,0.5);
  }
  .game-card.locked{opacity:0.6;}
  .card-art{
    height:110px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    background:
      radial-gradient(circle at 50% 20%, var(--tint,rgba(212,175,55,0.25)), transparent 65%),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0 10px, transparent 10px 20px);
  }
  .card-art svg{width:52px;height:52px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));}
  .tag{
    position:absolute;
    top:8px;
    left:8px;
    font-size:10px;
    font-weight:700;
    padding:3px 8px;
    border-radius:20px;
    background:var(--emerald);
    color:#0a0a0a;
    letter-spacing:0.5px;
  }
  .tag.soon{background:#555;color:#ddd;}
  .card-body{padding:10px 12px 14px;}
  .game-name{
    font-size:15px;
    font-weight:700;
    color:#fff;
    margin-bottom:8px;
  }
  .play-btn{
    display:block;
    width:100%;
    padding:9px 0;
    border:none;
    border-radius:10px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    background:linear-gradient(145deg,var(--gold-bright),#c9a227);
    color:#0a0a0a;
  }
  .play-btn.disabled{
    background:#2a2a2a;
    color:#888;
    cursor:not-allowed;
  }

  /* ===== Game view ===== */
  #gameView{display:none;}
  .back-btn{
    margin:12px 16px 0;
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:none;
    border:1.5px solid var(--gold);
    color:var(--gold-bright);
    padding:8px 16px;
    border-radius:30px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .container{max-width:400px;margin:0 auto;padding:16px;}
  .header{
    background:rgba(212,175,55,0.08);
    padding:16px;
    border-radius:15px;
    margin-bottom:16px;
    text-align:center;
    border:2px solid rgba(212,175,55,0.3);
  }
  .header h2{font-size:24px;color:var(--gold-bright);margin-bottom:6px;}
  .balance{font-size:20px;font-weight:bold;color:var(--gold-bright);}
  .slot-machine{
    background:rgba(0,0,0,0.5);
    border:3px solid var(--gold);
    border-radius:20px;
    padding:26px 18px;
    box-shadow:0 10px 30px rgba(212,175,55,0.25);
  }
  .reels{display:flex;justify-content:space-around;margin:26px 0;gap:10px;}
  .reel{
    width:88px;height:88px;
    background:rgba(255,255,255,0.08);
    border:3px solid var(--gold);
    border-radius:15px;
    display:flex;align-items:center;justify-content:center;
    font-size:50px;
    box-shadow:inset 0 0 10px rgba(0,0,0,0.5);
  }
  .reel.spinning{animation:spin 0.1s linear infinite;}
  @keyframes spin{0%{transform:translateY(0);}100%{transform:translateY(-20px);}}
  .controls{text-align:center;}
  .bet-selector{margin:18px 0;}
  .bet-selector label{display:block;margin-bottom:8px;font-size:15px;}
  .bet-selector input{
    width:80%;padding:10px;font-size:16px;border-radius:10px;
    border:2px solid var(--gold);background:rgba(255,255,255,0.08);
    color:#fff;text-align:center;
  }
  .spin-btn{
    background:linear-gradient(145deg,var(--gold-bright),#ffed4e);
    border:none;padding:16px 56px;font-size:20px;font-weight:bold;
    border-radius:50px;cursor:pointer;color:#0d0d0d;
    box-shadow:0 8px 20px rgba(255,215,0,0.4);margin-top:6px;
  }
  .spin-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .result{margin-top:20px;font-size:18px;min-height:28px;font-weight:bold;}
  .win{color:#00ff00;}
  .lose{color:#ff4444;}
  .stats{margin-top:18px;padding:14px;background:rgba(0,0,0,0.3);border-radius:10px;font-size:13px;}
  .stats div{margin:4px 0;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:#1c1c1c;border:1.5px solid var(--gold);color:var(--gold-bright);
    padding:10px 20px;border-radius:30px;font-size:14px;font-weight:600;
    opacity:0;transition:opacity 0.3s;pointer-events:none;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<!-- ===== LOBBY ===== -->
<div id="lobbyView">
  <div class="topbar">
    <div class="brand">🌳 الشجرة الذهبية</div>
    <div class="balance-pill">💰 <span id="lobbyBalance">...</span></div>
  </div>
  <div class="user-line" id="lobbyUserInfo">جاري التحميل...</div>

  <div class="grid" id="gamesGrid"></div>
</div>

<!-- ===== GAME ===== -->
<div id="gameView">
  <button class="back-btn" onclick="showLobby()">🔙 رجوع للألعاب</button>
  <div class="container">
    <div class="header">
      <h2>🌳 Golden Tree</h2>
      <div class="balance">💰 الرصيد: <span id="balance">...</span></div>
    </div>

    <div class="slot-machine">
      <div class="reels">
        <div class="reel" id="reel1">🍒</div>
        <div class="reel" id="reel2">🍋</div>
        <div class="reel" id="reel3">🍊</div>
      </div>

      <div class="controls">
        <div class="bet-selector">
          <label>💵 الرهان:</label>
          <input type="number" id="betAmount" value="10" min="10" max="100" step="10">
        </div>

        <button class="spin-btn" id="spinBtn" onclick="spin()">🎰 اسحب</button>

        <div class="result" id="result"></div>
      </div>

      <div class="stats">
        <div>🎲 عدد المحاولات: <span id="totalSpins">0</span></div>
        <div>🏆 مجموع الأرباح: <span id="totalWins">0</span></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">🔒 قريبًا</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, set, get, update } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

const firebaseConfig = {
    apiKey: "AIzaSyAfsY0dQI9qnIrksRqY4TvOe7YtPhig_Pg",
    authDomain: "chekinroad-afa14.firebaseapp.com",
    databaseURL: "https://chekinroad-afa14-default-rtdb.firebaseio.com",
    projectId: "chekinroad-afa14",
    storageBucket: "chekinroad-afa14.firebasestorage.app",
    messagingSenderId: "871996125208",
    appId: "1:871996125208:web:7f98cf25c469ea0568536d"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

const userId = tg.initDataUnsafe?.user?.id || 'test_' + Date.now();
const userName = tg.initDataUnsafe?.user?.first_name || 'ضيف';

document.getElementById('lobbyUserInfo').textContent = `مرحباً ${userName} 👋`;

/* ===== أيقونات أصلية (SVG بسيط لكل لعبة، مش شعارات الألعاب الحقيقية) ===== */
const ICONS = {
  goldenTree: `<svg viewBox="0 0 64 64"><circle cx="32" cy="24" r="18" fill="#3ddc97"/><rect x="29" y="38" width="6" height="20" rx="2" fill="#8a5a2b"/><circle cx="24" cy="20" r="3" fill="#ffd700"/><circle cx="38" cy="18" r="3" fill="#ffd700"/><circle cx="32" cy="30" r="3" fill="#ffd700"/><circle cx="20" cy="30" r="2.5" fill="#ffd700"/><circle cx="42" cy="28" r="2.5" fill="#ffd700"/></svg>`,
  frankenstein: `<svg viewBox="0 0 64 64"><rect x="14" y="10" width="36" height="6" fill="#222"/><rect x="14" y="14" width="36" height="34" rx="4" fill="#6fae5a"/><rect x="9" y="24" width="6" height="8" fill="#3a3a3a"/><rect x="49" y="24" width="6" height="8" fill="#3a3a3a"/><circle cx="24" cy="28" r="3" fill="#111"/><circle cx="40" cy="28" r="3" fill="#111"/><rect x="20" y="38" width="24" height="4" fill="#111"/></svg>`,
  aviator: `<svg viewBox="0 0 64 64"><path d="M4 34 L52 30 L60 34 L52 38 L4 34 Z" fill="#e63946"/><path d="M27 20 L34 30 L27 34 Z" fill="#e63946"/><path d="M27 48 L34 34 L27 38 Z" fill="#e63946"/><circle cx="57" cy="34" r="3" fill="#333"/></svg>`,
  spicySeven: `<svg viewBox="0 0 64 64"><path d="M32 6c6 8-4 10 0 18 3-2 5-6 5-10 6 6 6 16-2 22-7 5-16 0-16-8 0-6 6-8 6-14 0-4-2-6-2-6 4 0 7 0 9-2z" fill="#ff8c1a"/><text x="32" y="46" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">7</text></svg>`,
  wildApe: `<svg viewBox="0 0 64 64"><circle cx="16" cy="20" r="7" fill="#8a5a2b"/><circle cx="48" cy="20" r="7" fill="#8a5a2b"/><circle cx="32" cy="32" r="20" fill="#8a5a2b"/><circle cx="32" cy="34" r="14" fill="#d9a066"/><circle cx="25" cy="32" r="2.5" fill="#111"/><circle cx="39" cy="32" r="2.5" fill="#111"/><ellipse cx="32" cy="42" rx="6" ry="3" fill="#5c3a1e"/></svg>`,
  comingSoon: `<svg viewBox="0 0 64 64"><path d="M24 28v-6a8 8 0 0116 0v6" stroke="#888" stroke-width="4" fill="none"/><rect x="18" y="28" width="28" height="22" rx="4" fill="#555"/><text x="32" y="45" font-size="16" font-weight="700" text-anchor="middle" fill="#ddd">?</text></svg>`
};

/* ===== قائمة الألعاب — نفس الترتيب المعتمد (عدّلي هون لما تجهز لعبة جديدة) ===== */
const GAMES = [
  { id:'frankenstein', name:'Frankenstein', icon:ICONS.frankenstein, tint:'rgba(111,174,90,0.3)', tag:null, ready:false },
  { id:'golden-tree',  name:'Golden Tree',  icon:ICONS.goldenTree,   tint:'rgba(61,220,151,0.3)', tag:'HOT', ready:true },
  { id:'aviator',      name:'Aviator',      icon:ICONS.aviator,      tint:'rgba(230,57,70,0.3)',  tag:null, ready:false },
  { id:'spicy-seven',  name:'Spicy Seven',  icon:ICONS.spicySeven,   tint:'rgba(255,140,26,0.3)', tag:null, ready:false },
  { id:'coming-soon',  name:'قريبًا',        icon:ICONS.comingSoon,   tint:'rgba(120,120,120,0.25)', tag:'SOON', ready:false },
  { id:'wild-ape',     name:'Wild Ape',     icon:ICONS.wildApe,      tint:'rgba(138,90,43,0.3)',  tag:null, ready:false }
];

function renderGrid(){
  const grid = document.getElementById('gamesGrid');
  grid.innerHTML = GAMES.map(g => `
    <div class="game-card ${g.ready ? '' : 'locked'}">
      <div class="card-art" style="--tint:${g.tint}">
        ${g.tag ? `<span class="tag ${g.ready ? '' : 'soon'}">${g.tag}</span>` : ''}
        ${g.icon}
      </div>
      <div class="card-body">
        <div class="game-name">${g.name}</div>
        <button class="play-btn ${g.ready ? '' : 'disabled'}" onclick="${g.ready ? `openGame('${g.id}')` : `notReady()`}">
          ${g.ready ? '🎮 العب الآن' : '🔒 قريبًا'}
        </button>
      </div>
    </div>
  `).join('');
}
renderGrid();

window.notReady = function(){
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 1500);
}

window.openGame = function(id){
  if(id === 'golden-tree'){
    document.getElementById('lobbyView').style.display = 'none';
    document.getElementById('gameView').style.display = 'block';
    loadUserData();
  }
}

window.showLobby = function(){
  document.getElementById('gameView').style.display = 'none';
  document.getElementById('lobbyView').style.display = 'block';
  loadLobbyBalance();
}

/* ===== رصيد اللوبي ===== */
async function loadLobbyBalance(){
  try{
    const snap = await get(ref(db, 'users/' + userId));
    const balance = snap.exists() && typeof snap.val().balance === 'number' ? snap.val().balance : 0;
    document.getElementById('lobbyBalance').textContent = balance;
  }catch(e){
    document.getElementById('lobbyBalance').textContent = '⚠️';
  }
}
loadLobbyBalance();

/* ===== لعبة الشجرة الذهبية (نفس المنطق الأصلي) ===== */
const symbols = ['🍒','🍋','🍊','🍇','💎','🌳','⭐'];
let balance = 0, spinning = false, totalSpins = 0, totalWins = 0;

async function loadUserData(){
  try{
    const userRef = ref(db, 'users/' + userId);
    const snapshot = await get(userRef);
    if(snapshot.exists()){
      const userData = snapshot.val();
      balance = (typeof userData.balance === 'number') ? userData.balance : 0;
      totalSpins = userData.totalSpins || 0;
      totalWins = userData.totalWins || 0;
    }else{
      balance = 0;
      await set(userRef, { name:userName, balance:0, totalSpins:0, totalWins:0, createdAt:Date.now() });
    }
    updateDisplay();
  }catch(error){
    console.error('خطأ:', error);
    document.getElementById('result').innerHTML = '<span class="lose">⚠️ خطأ في الاتصال</span>';
  }
}

function updateDisplay(){
  document.getElementById('balance').textContent = balance;
  document.getElementById('totalSpins').textContent = totalSpins;
  document.getElementById('totalWins').textContent = totalWins;
}

async function saveUserData(){
  try{
    await update(ref(db, 'users/' + userId), {
      balance, totalSpins, totalWins, lastPlayed: Date.now()
    });
  }catch(error){ console.error('خطأ في الحفظ:', error); }
}

window.spin = async function(){
  const betAmount = parseInt(document.getElementById('betAmount').value);
  if(spinning) return;
  if(balance < betAmount){
    document.getElementById('result').innerHTML = '<span class="lose">❌ رصيدك غير كافي!</span>';
    return;
  }
  spinning = true;
  balance -= betAmount;
  totalSpins++;
  updateDisplay();
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('result').textContent = '';

  const reels = ['reel1','reel2','reel3'];
  reels.forEach(id => document.getElementById(id).classList.add('spinning'));

  let spinCount = 0;
  const spinInterval = setInterval(() => {
    reels.forEach(id => {
      document.getElementById(id).textContent = symbols[Math.floor(Math.random()*symbols.length)];
    });
    spinCount++;
    if(spinCount >= 15){
      clearInterval(spinInterval);
      showResult(betAmount);
    }
  }, 100);
}

async function showResult(betAmount){
  const reels = ['reel1','reel2','reel3'];
  reels.forEach(id => document.getElementById(id).classList.remove('spinning'));

  const r1 = symbols[Math.floor(Math.random()*symbols.length)];
  const r2 = symbols[Math.floor(Math.random()*symbols.length)];
  const r3 = symbols[Math.floor(Math.random()*symbols.length)];
  document.getElementById('reel1').textContent = r1;
  document.getElementById('reel2').textContent = r2;
  document.getElementById('reel3').textContent = r3;

  let winAmount = 0, won = false;
  if(r1 === r2 && r2 === r3){
    if(r1 === '🌳') winAmount = betAmount*50;
    else if(r1 === '💎') winAmount = betAmount*20;
    else if(r1 === '⭐') winAmount = betAmount*15;
    else winAmount = betAmount*5;
    won = true;
  }else if(r1 === r2 || r2 === r3 || r1 === r3){
    winAmount = betAmount*2;
    won = true;
  }

  if(won){
    balance += winAmount;
    totalWins += winAmount;
    document.getElementById('result').innerHTML = `<span class="win">🎉 ربحت ${winAmount} NSP!</span>`;
    if(navigator.vibrate) navigator.vibrate([100,50,100]);
  }else{
    document.getElementById('result').innerHTML = '<span class="lose">😔 حاول مرة أخرى</span>';
  }
  updateDisplay();
  await saveUserData();
  spinning = false;
  document.getElementById('spinBtn').disabled = false;
}
</script>
</body>
</html>
